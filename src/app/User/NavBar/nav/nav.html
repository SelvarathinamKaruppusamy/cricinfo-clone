<mat-toolbar color="primary" class="navbar">

  <div class="nav-left">
    <mat-icon>sports_cricket</mat-icon>
    <span class="logo">CricInfo</span>
  </div>

  <span class="spacer"></span>

  <!-- Desktop Menu -->
  <div class="desktop-menu">

    @for (item of items; track item.route) {
    @if (item.label === 'Quiz') {
    <a mat-button class="nav-link quiz-link" [class.active-link]="activateRoute === item.route"
      (click)="getMethod(item.route)">

      <mat-icon class="quiz-icon">sports_esports</mat-icon>
      {{ item.label }}
    </a>
    } @else {
    <a mat-button class="nav-link" [class.active-link]="activateRoute === item.route" (click)="getMethod(item.route)">
      {{ item.label }}
    </a>
    }
    }

    <button mat-button class="nav-link" [matMenuTriggerFor]="statsMenu">

      Stats
      <mat-icon>arrow_drop_down</mat-icon>

    </button>

  </div>

  <button mat-icon-button class="mobile-menu-btn" [matMenuTriggerFor]="mobileMenu">

    <mat-icon>menu</mat-icon>

  </button>

</mat-toolbar>

<mat-menu #statsMenu="matMenu">

  <button mat-menu-item (click)="getMethod('/stats/overall')">
    Overall Stats
  </button>

  <button mat-menu-item (click)="getMethod('/stats/purple')">
    Purple Cap
  </button>

  <button mat-menu-item (click)="getMethod('/stats/orange')">
    Orange Cap
  </button>

</mat-menu>

<mat-menu #mobileMenu="matMenu">

  @for (item of items; track item.route) {

  <button mat-menu-item (click)="getMethod(item.route)">

    {{ item.label }}

  </button>

  }

  <button mat-menu-item [matMenuTriggerFor]="statsMenu">

    Stats

  </button>

</mat-menu>
